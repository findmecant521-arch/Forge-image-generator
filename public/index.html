<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge AI - Image Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-900 border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold mb-4 text-center">Forge AI Image Generator</h1>
        
        <!-- Prompt Input -->
        <div class="mb-4">
            <label for="promptInput" class="block text-sm font-medium text-gray-300 mb-2">Enter your prompt:</label>
            <textarea id="promptInput" rows="3" class="w-full bg-slate-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500" placeholder="A futuristic cyberpunk city at sunset..."></textarea>
        </div>

        <!-- Generate Button -->
        <button onclick="generateAIImage()" class="w-full bg-indigo-600 hover:bg-indigo-700 font-semibold py-3 rounded-lg transition duration-200 shadow-md">
            Generate Masterpiece
        </button>

        <!-- Display Area / Canvas -->
        <div id="imageCanvas" class="mt-6 relative w-full h-80 bg-slate-800 border border-gray-700 rounded-xl overflow-hidden flex items-center justify-center">
            <!-- Placeholder Text -->
            <span id="placeholderText" class="text-gray-400 text-sm">Your generated image will appear here</span>
            
            <!-- Loader (hidden by default) -->
            <div id="loader" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500 mb-3"></div>
                <span id="loaderText" class="text-sm font-medium text-gray-300">FORGING MASTERPIECE WITH HUGGING FACE...</span>
            </div>
        </div>
    </div>

    <script>
        async function generateAIImage() {
            const prompt = document.getElementById('promptInput').value.trim();
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            const placeholder = document.getElementById('placeholderText');
            const canvas = document.getElementById('imageCanvas');

            if (!prompt) {
                alert('Please type a prompt first!');
                return;
            }

            loader.classList.remove('hidden');
            placeholder.classList.add('hidden');
            loaderText.innerText = "FORGING MASTERPIECE WITH HUGGING FACE...";

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to generate image');
                }

                canvas.innerHTML = `
                    <img src="${data.imageUrl}" alt="Generated AI Art" class="w-full h-full object-cover">
                    <div class="absolute bottom-3 left-3 bg-darkBg/85 backdrop-blur-md px-3 py-1.5 rounded-lg text-xs font-medium text-gray-200 border border-gray-700 shadow-lg">
                        ✨ Prompt: "${prompt}"
                    </div>
                `;
            } catch (err) {
                alert('Error: ' + err.message);
                placeholder.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
